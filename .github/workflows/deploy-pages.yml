name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test quiz rules
        run: node --test tests/*.test.mjs

  deploy:
    if: github.event.repository.private == false
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble the static site
        run: |
          mkdir -p _site
          cp index.html style.css app.js history-tables.mjs typing-core.mjs quiz-core.mjs pattern-games.mjs distraction-sounds.mjs adaptive-practice.mjs progress-analytics.mjs fraud-inspection.mjs check-holds.mjs hold-training-ui.mjs sample-history.mjs _site/
          cp chess-*.mjs _site/
          cp overload-*.mjs _site/
          mkdir -p _site/assets/chess
          cp assets/chess/* _site/assets/chess/
          mkdir -p _site/assets/fraud
          cp assets/fraud/id-portrait-female-20260922.jpg assets/fraud/id-portrait-male-20260922.jpg assets/fraud/id-portrait-female-2-20260929.jpg assets/fraud/id-portrait-male-2-20260929.jpg _site/assets/fraud/
      - name: Upload the static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
